name: Build LBA Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare LESBAD Windows icon
        shell: pwsh
        run: |
          python -m pip install pillow --disable-pip-version-check
          @'
          from pathlib import Path
          from PIL import Image
          source=Path("src/assets/lesbad-icon-clean.jpg")
          target=Path("electron")
          target.mkdir(exist_ok=True)
          image=Image.open(source).convert("RGBA")
          # electron-builder requires a source icon of at least 256x256.
          # Upscale the clean supplied artwork before generating the Windows ICO.
          image=image.resize((512,512),Image.Resampling.LANCZOS)
          image.save(target/"lesbad-icon.png","PNG",optimize=True)
          image.save(target/"lesbad-icon.ico","ICO",sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print("Prepared LESBAD desktop icon:", target/"lesbad-icon.ico")
          '@ | Set-Content prepare_icon.py
          python prepare_icon.py
      - name: Build Windows desktop app
        env:
          VITE_API_BASE: https://lba-backend-production.up.railway.app/api
        run: npm run desktop:build
      - name: Upload Windows portable app
        uses: actions/upload-artifact@v4
        with:
          name: lba-desktop-windows
          path: frontend/dist-electron/*.exe
          if-no-files-found: error

      - name: Publish Windows EXE to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          FILE="dist-electron/LBA-Tournament-Desktop-${VERSION}-x64.exe"
          test -s "$FILE"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$FILE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "LBA Admin System ${TAG} — Windows" --notes "Portable Windows x64 build. Download the .exe under Assets; no installation required."
          fi
