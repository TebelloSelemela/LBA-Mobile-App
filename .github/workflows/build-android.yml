name: Build LBA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        env:
          VITE_API_BASE: https://lba-backend-production.up.railway.app/api
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Apply LBA launcher icon
        run: |
          cp src/assets/lba-logo.png android/app/src/main/res/drawable/lba_launcher.png
          sed -i 's#@mipmap/ic_launcher_round#@drawable/lba_launcher#g; s#@mipmap/ic_launcher#@drawable/lba_launcher#g' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lba-mobile-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
