name: Build signed Android release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Android version name
        required: true
        default: '1.7'
        type: string
      version_code:
        description: Increasing Android version code (greater than 7)
        required: true
        default: '8'
        type: string
  workflow_call:
    inputs:
      version_name:
        required: true
        type: string
      version_code:
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        env:
          VITE_API_BASE: https://lba-backend-production.up.railway.app/api
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply LESBAD MOBILE name, network access and launcher icon
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if "android.permission.INTERNET" not in text:
              lines = text.splitlines()
              manifest_index = next(i for i, line in enumerate(lines) if line.strip().startswith("<manifest"))
              lines.insert(manifest_index + 1, permission)
              text = "\n".join(lines) + "\n"
          text = text.replace('@mipmap/ic_launcher_round','@drawable/lesbad_mobile_icon')
          text = text.replace('@mipmap/ic_launcher','@drawable/lesbad_mobile_icon')
          manifest.write_text(text)

          strings = Path("android/app/src/main/res/values/strings.xml")
          s = strings.read_text()
          import re
          s = re.sub(r'<string name="app_name">.*?</string>','<string name="app_name">LESBAD MOBILE</string>',s)
          s = re.sub(r'<string name="title_activity_main">.*?</string>','<string name="title_activity_main">LESBAD MOBILE</string>',s)
          strings.write_text(s)

          gradle = Path("android/app/build.gradle")
          g = gradle.read_text()
          import os
          version_code = os.environ['VERSION_CODE']
          version_name = os.environ['VERSION_NAME']
          if not version_code.isdecimal() or not 7 < int(version_code) <= 2100000000:
              raise ValueError('version_code must be greater than 7 and at most 2100000000')
          if not re.fullmatch(r'[0-9]+\.[0-9]+(?:\.[0-9]+)?', version_name):
              raise ValueError('version_name must be numeric major.minor or major.minor.patch')
          g = re.sub(r'versionCode\s+\d+', 'versionCode ' + version_code, g)
          g = re.sub(r'versionName\s+"[^"]+"', 'versionName "' + version_name + '"', g)
          gradle.write_text(g)
          PY
          cp src/assets/lesbad-icon-clean.jpg android/app/src/main/res/drawable/lesbad_mobile_icon.jpg
          echo "Launcher icon entries:"
          grep -n "android:icon\|android:roundIcon" android/app/src/main/AndroidManifest.xml
          grep -n "app_name" android/app/src/main/res/values/strings.xml

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.jks"
          test -s "$RUNNER_TEMP/android-release.jks"

      - name: Configure release signing
        run: python ../scripts/configure-android-release.py

      - name: Build signed release APK and AAB
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify and stage release artifacts
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB"
          python - "$AAB" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as bundle:
              names = bundle.namelist()
              assert any(n.startswith('META-INF/') and n.endswith(('.RSA', '.DSA', '.EC')) for n in names), 'AAB signature missing'
          PY
          mkdir -p ../release
          cp "$APK" "../release/LESBAD-Mobile-${VERSION_NAME}.apk"
          cp "$AAB" "../release/LESBAD-Mobile-${VERSION_NAME}.aab"
          cd ../release
          sha256sum *.apk *.aab > SHA256SUMS.txt

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lesbad-mobile-release
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.jks"
